<!doctype html>

<style>

  h1 { font-size: 104px; line-height: .95; margin: 26px 0 0; font-weight: 400; letter-spacing: -2px; }

  .chips { position: absolute; left: 80px; bottom: 70px; display: flex; gap: 14px; }
  .chip { font: 500 20px/1 "Helvetica Neue", Arial, sans-serif; padding: 12px 18px; border: 1px solid rgba(255,255,255,.18); border-radius: 999px; color: #eceae3; }
  .chip b { color: #e9a23b; font-weight: 600; }
  .mark { position: absolute; right: 90px; top: 86px; width: 120px; height: 120px; }

  <div class="glow"></div><div class="grid"></div>

  <div class="wrap">
    <div class="kicker">Software Engineer</div>
